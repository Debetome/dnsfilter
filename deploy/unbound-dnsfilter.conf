# /etc/unbound/unbound.conf.d/dnsfilter.conf
# unbound = DNSSEC validation + cache. It is NOT the public listener any more:
# dnsfilter is. unbound only talks to dnsfilter (in) and dnscrypt-proxy (out).

server:
    interface: 127.0.0.1@5335
    access-control: 127.0.0.0/8 allow          # everything else is refused by default

    # unbound refuses to query 127.0.0.0/8 by default. Your upstream
    # (dnscrypt-proxy) IS on loopback, so without this every query SERVFAILs.
    do-not-query-localhost: no

    # --- DNSSEC (validation happens here, not in dnsfilter) ---
    # Debian/Ubuntu already ship this in /etc/unbound/unbound.conf.d/root-auto-trust-anchor-file.conf
    # -- if so, delete the next line.
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    harden-dnssec-stripped: yes
    harden-glue: yes
    val-clean-additional: yes

    # --- sanity ---
    edns-buffer-size: 1232                     # avoids IP fragmentation
    prefetch: yes
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: no                        # no point when forwarding to a local proxy

forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5353               # dnscrypt-proxy
    forward-first: no                          # never fall back to unencrypted recursion
